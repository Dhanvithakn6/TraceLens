name: tracelens-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP/gRPC
      - "127.0.0.1:4318:4318" # OTLP/HTTP
    depends_on:
      - tempo
    mem_limit: 512m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo/tempo.yaml", "-target=all"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200" # Tempo HTTP API
    mem_limit: 2g
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - tempo
      - alertmanager
    mem_limit: 768m
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.35.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6-slim
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning/datasources/tempo.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
      - ../observability/grafana/provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - tempo
      - prometheus
    mem_limit: 768m
    restart: unless-stopped

volumes:
  alertmanager-data:
  tempo-data:
  prometheus-data:
