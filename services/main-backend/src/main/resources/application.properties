spring.application.name=main-backend
server.port=8085

management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C
management.otlp.tracing.export.enabled=true
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.endpoints.web.exposure.include=health,info,prometheus

checkout.services.user.base-url=http://localhost:8084
checkout.services.order.base-url=http://localhost:8082
checkout.services.payment.base-url=http://localhost:8083

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
tracelens.kafka.incidents-topic=${KAFKA_INCIDENTS_TOPIC:tracelens.incidents}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:tracelens-main-backend}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.tracelens.contracts.incident.IncidentEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.tracelens.contracts.incident
spring.kafka.listener.ack-mode=record
tracelens.kafka.dead-letter-topic=${KAFKA_INCIDENTS_DLT:tracelens.incidents.DLT}

spring.datasource.url=${TRACELENS_DB_URL:jdbc:postgresql://localhost:5432/tracelens}
spring.datasource.username=${TRACELENS_DB_USERNAME:}
spring.datasource.password=${TRACELENS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
